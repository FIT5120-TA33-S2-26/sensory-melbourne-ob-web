name: sensory-melbourne

services:
  db:
    image: amis0020/ta33-database:v2
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Australia/Melbourne
      PGTZ: Australia/Melbourne
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      additional_contexts:
        data_model: ../sensory-melbourne-ob-data/model
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_DIRECTIONS_URL: https://api.openrouteservice.org/v2/directions/foot-walking/geojson
      ORS_GEOCODE_AUTOCOMPLETE_URL: https://api.openrouteservice.org/geocode/autocomplete
      ORS_GEOCODE_REVERSE_URL: https://api.openrouteservice.org/geocode/reverse
      ORS_TIMEOUT_SECONDS: 15
      GEOCODE_RESULT_LIMIT: 6
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5500/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
